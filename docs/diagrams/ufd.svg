<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="100%" role="img"><style>
 .bg{fill:#fff}.box{fill:#f4f6f8;stroke:#5b6770;stroke-width:1.4}.unit{fill:#e6f0fb;stroke:#2563a8;stroke-width:1.6}.util{fill:#eaf6ee;stroke:#2f7d4f;stroke-width:1.6}
 .src{fill:#fdf1e3;stroke:#b4691f;stroke-width:1.6}.title{font:600 13px system-ui,sans-serif;fill:#14202b}.t{font:12px system-ui,sans-serif;fill:#14202b}.sm{font:11px system-ui,sans-serif;fill:#3b4a56}
 .h{font:700 17px system-ui,sans-serif;fill:#14202b}.note{font:11px system-ui,sans-serif;fill:#6b4a12}.ln{stroke:#33414c;stroke-width:1.6;fill:none}.st{stroke:#b4691f;stroke-width:2.2;fill:none}
 .cw{stroke:#2563a8;stroke-width:2.2;fill:none}.gas{stroke:#2f7d4f;stroke-width:2.2;fill:none}.dm{stroke:#7b3fa0;stroke-width:2.2;fill:none}.el{stroke:#a82525;stroke-width:2;fill:none;stroke-dasharray:6 4}
 @media (prefers-color-scheme:dark){.bg{fill:#14181c}.box{fill:#1f262d;stroke:#7a8894}.unit{fill:#1b2e44;stroke:#6aa6e8}.util{fill:#1a3025;stroke:#5fb784}.src{fill:#3a2a17;stroke:#e0a060}
 .title,.t,.h{fill:#e8edf1}.sm{fill:#b4c0ca}.note{fill:#e8c98a}.ln{stroke:#b4c0ca}.st{stroke:#e0a060}.cw{stroke:#6aa6e8}.gas{stroke:#5fb784}.dm{stroke:#c08ae0}.el{stroke:#e07070}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect class="bg" width="1240" height="700"/><text class="h" x="20" y="28">Utilities flow diagram: steam, demin water, cooling water, compressed air, nitrogen</text><rect class="src" x="20" y="70" width="200" height="90" rx="6"/><text class="title" x="30" y="90">Boiler (B11A basis)</text><text class="t" x="30" y="108">main steam 1050 F, 2415 psia</text><text class="t" x="30" y="123">1,869,001 kg/h</text><text class="t" x="30" y="138">1,235 MW fluid heat</text><rect class="unit" x="300" y="70" width="250" height="90" rx="6"/><text class="title" x="310" y="90">Turbine</text><text class="t" x="310" y="108">extraction at 1 MPa</text><text class="t" x="310" y="123">steam 33,814 kg/h (1.8% of main)</text><text class="t" x="310" y="138">power lost 5.90 MW net</text><rect class="unit" x="610" y="70" width="200" height="90" rx="6"/><text class="title" x="620" y="90">Process heater H1</text><text class="t" x="620" y="108">duty 18.92 MW</text><text class="t" x="620" y="123">condenses at 180 C</text><text class="t" x="620" y="138">-&gt; 120 C gasoline pool</text><path class="st" d="M220 115 L300 115" marker-end="url(#a)"/><text class="sm" x="228" y="104">main steam</text><path class="st" d="M550 115 L610 115" marker-end="url(#a)"/><text class="sm" x="551" y="104">extraction</text><rect class="box" x="610" y="220" width="200" height="66" rx="6"/><text class="title" x="620" y="240">Condensate</text><text class="t" x="620" y="258">16,907 kg/h returned at 90 C</text><text class="t" x="620" y="273">16,907 kg/h lost</text><path class="st" d="M710 160 L710 220" marker-end="url(#a)"/><rect class="unit" x="300" y="220" width="250" height="66" rx="6"/><text class="title" x="310" y="240">Feedwater train</text><text class="t" x="310" y="258">4 heaters 100-800 kPa (cascade)</text><text class="t" x="310" y="273">return credit 0.15 MW</text><path class="dm" d="M610 253 L550 253" marker-end="url(#a)"/><text class="sm" x="560" y="244">return</text><path class="st" d="M300 253 L120 253 L120 160" marker-end="url(#a)"/><text class="sm" x="130" y="245">feedwater</text><rect class="util" x="610" y="340" width="200" height="78" rx="6"/><text class="title" x="620" y="360">Demin plant</text><text class="t" x="620" y="378">make-up 17,245 kg/h</text><text class="t" x="620" y="393">raw water 20,288 kg/h</text><text class="t" x="620" y="408">reject 3,043 kg/h</text><path class="dm" d="M610 379 L425 379 L425 286" marker-end="url(#a)"/><text class="sm" x="440" y="372">demin make-up</text><rect class="util" x="860" y="70" width="280" height="100" rx="6"/><text class="title" x="870" y="90">Cooling tower loop</text><text class="t" x="870" y="108">duty 5.34 MW (30-&gt;40 C)</text><text class="t" x="870" y="123">circulation 462 m3/h</text><text class="t" x="870" y="138">make-up 7.9 m3/h, blowdown 2.0 m3/h</text><rect class="unit" x="860" y="220" width="280" height="66" rx="6"/><text class="title" x="870" y="240">Coolers</text><text class="t" x="870" y="258">compressor coolers 0.34 MW</text><text class="t" x="870" y="273">other process 5.00 MW</text><path class="cw" d="M930 170 L930 220" marker-end="url(#a)"/><text class="sm" x="936" y="200">cold</text><path class="cw" d="M1070 220 L1070 170" marker-end="url(#a)"/><text class="sm" x="1076" y="200">hot</text><rect class="unit" x="860" y="340" width="280" height="96" rx="6"/><text class="title" x="870" y="360">Plant / instrument air</text><text class="t" x="870" y="378">2,000 Nm3/h to 0.8 MPa abs</text><text class="t" x="870" y="393">2 stages, 213 kW</text><text class="t" x="870" y="408">0.11 kWh/Nm3</text><rect class="unit" x="860" y="470" width="280" height="110" rx="6"/><text class="title" x="870" y="490">Nitrogen (PSA)</text><text class="t" x="870" y="508">500 Nm3/h, 99.5%, 0.8 MPa abs</text><text class="t" x="870" y="523">feed air 1,416 Nm3/h (recovery 0.45, assumed)</text><text class="t" x="870" y="538">151 kW, 0.30 kWh/Nm3</text><text class="t" x="870" y="553">reversible minimum 4.4 kW</text><path class="gas" d="M1140 388 L1215 388" marker-end="url(#a)"/><text class="sm" x="1146" y="380">to plant</text><path class="gas" d="M1140 525 L1215 525" marker-end="url(#a)"/><text class="sm" x="1146" y="517">to plant</text><path class="cw" d="M960 340 L960 286" marker-end="url(#a)"/><text class="sm" x="966" y="318">air cooler duty</text><path class="cw" d="M860 520 L835 520 L835 253 L860 253" marker-end="url(#a)"/><text class="sm" x="756" y="512">N2 cooler</text><text class="sm" x="756" y="526">duty</text><rect class="box" x="20" y="470" width="730" height="90" rx="6"/><text class="title" x="30" y="490">Electricity and totals</text><text class="t" x="30" y="508">compressors + nitrogen: 363 kW (air 213, N2 151)</text><text class="t" x="30" y="523">cooling duty 5.34 MW -&gt; circulation 462 m3/h, make-up 7.9 m3/h</text><text class="t" x="30" y="538">steam 33,814 kg/h, demin make-up 17,245 kg/h, turbine power lost 5.90 MW (gross 6.05)</text><text class="note" x="20" y="620">Illustrative inputs: 0.88 turbine efficiencies, 3 K heater TTD, 50% condensate return at 90 C, PSA recovery 0.45, header pressures, air/N2/other cooling demands, 1% blowdown, 85% demin recovery, 75% evaporative cooling, 4 cycles.</text><text class="note" x="20" y="636">Steam properties CoolProp; heater duty from DWSIM stream enthalpies; surrogate compounds stand in for the lumped pool. Screening only, not compared with plant data.</text><text class="note" x="20" y="660">Lines: orange steam, purple demin and condensate, blue cooling water, green gas. The link to the process heater is one-way: nothing here feeds back into the simulated flowsheet.</text></svg>